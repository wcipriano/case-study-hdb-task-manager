# This workflow will test and check quality of the code
name: Tests
on:
  push:
    branches:
      - dev
      - dev2
      - hml
      - master
jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11
      - name: Install the project dependencies
        run: | 
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests with coverage
        run: python -m pytest -v --cov-report=xml --cov=./ --cov-branch
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: SAST - Code Security
        run: bandit *

      # Run the dedicated Python vulnerability scanner
      - name: SAST - Dependency check with Pip Audit
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt
