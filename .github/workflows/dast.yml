name: DAST com OWASP ZAP

on:
  push:
    branches: [master, hml]
  pull_request:
    branches: [master, hml]

jobs:
  dast-scan:
    name: build run and test ZAP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11
      - name: Install the project dependencies
        run: | 
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          flask --app ${{vars.FLASK_APP}} run --port ${{vars.FLASK_RUN_PORT}} &
          sleep 5

      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: 'http://localhost:${{vars.FLASK_RUN_PORT}}'
          rules_file_name: '.zap/rules.tsv'
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Save ZAP Report
        uses: actions/upload-artifact@v7
        with:
          name: zap-report
          path: |
            **/zap-report-html.html
            **/zap-report-json.json
